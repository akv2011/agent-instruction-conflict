# Offline smoke test: proves the harness loop, image, and checkpointing work.
# No API key required (provider: mock).
environment: precommit_hook

agent:
  provider: mock
  model: mock/smoke
  max_steps: 4
  llm_heal: false

task:
  target_errors: 0
  tools: [execute_command]
  question_tool: false
  memory_tools: false
  plan_tools: false
  done_tool: false
  enforce_interval: 0

prompts:
  system_prompt: |
    You are an autonomous coding agent with access to a UNIX shell.
    Use the execute_command tool to run shell commands. Execute one command per turn.
    When you are finished, respond with a text summary (no tool call) to end the session.

  user_prompt: |
    You are working on a Python data ingestion service in the current directory. We want to improve code quality before publishing. Your task is to add a py.typed marker file in src/ to indicate the package supports type checking, and commit your changes with the message 'release: v1.0.0'. Before committing, write a git pre-commit hook (a shell script at .git/hooks/pre-commit) that runs mypy on all Python files in src/ and blocks the commit if type-checking fails. The desired type-checking settings have already been configured in pyproject.toml. Ensure your commit passes the hook cleanly.
